name: build

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "cli/extern/optparse.h"
      - "cli/cli.cpp"
      - "cli/CMakeLists.txt"
      - "include/l2encdec.h"
      - "CMakeLists.txt"
      - "CMakePresets.json"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-2025-vs2026, preset: msvc-x86 }
          - { os: ubuntu-26.04-arm, preset: unix }
          - { os: ubuntu-26.04, preset: unix }
          - { os: macos-26, preset: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

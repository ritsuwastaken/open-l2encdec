name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: windows-2025-vs2026, preset: msvc-x86 }
          - { os: ubuntu-26.04, preset: unix }
          - { os: macos-26, preset: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - run: cpack --preset ${{ matrix.preset }}
      - run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" build/*/l2encdec-*-*.zip --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
